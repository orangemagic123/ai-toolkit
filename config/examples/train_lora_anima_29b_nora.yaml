---
# Anima-2.9B LoRA with NoRA (Normalized Low-Rank Adaptation, arXiv 2608.31036).
# See train_lora_anima_29b.yaml for the model notes; only network.nora and lr differ.
#
# network.nora
#   continuous: train the raw down projection behind a per-column normalization
#               (the paper's NoRA). Saved files hold the normalized weights, so
#               they load anywhere a plain LoRA does.
#   init:       normalize the down projection once at creation, then train a
#               plain LoRA (NoRA-init).
# Keep linear_alpha equal to linear. NoRA's down projection is much larger than
# the default LoRA init (the log prints the factor), which raises the effective
# up-projection learning rate. Don't reuse your LoRA lr as is: sweep about 1x,
# 1/3 and 1/10 of it.
job: extension
config:
  name: anima_29b_nora
  process:
    - type: diffusion_trainer
      training_folder: output
      device: cuda:0
      network:
        type: lora
        nora: continuous
        linear: 32
        linear_alpha: 32
      save:
        dtype: bf16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: /path/to/images
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [1024]
      train:
        batch_size: 1
        gradient_accumulation: 1
        steps: 2000
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        timestep_type: weighted
        optimizer: adamw8bit
        lr: 0.00003
        dtype: bf16
      model:
        name_or_path: Gazingstars123/Anima-2.9B
        arch: anima:2.9b
        quantize: false
        quantize_te: false
        model_kwargs:
          train_text_conditioner: false
          max_sequence_length: 512
      sample:
        sampler: flowmatch
        sample_every: 250
        width: 1024
        height: 1024
        samples:
          - prompt: '1girl, blue hair, white dress, flower garden, sunlight, anime illustration'
        neg: 'worst quality, low quality, blurry, jpeg artifacts'
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 30
meta:
  name: '[name]'
  version: '1.0'
